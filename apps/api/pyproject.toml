[project]
name = "music-world"
version = "0.1.0"
description = "Music World API, analysis worker and shared schemas"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "alembic>=1.14",
  "arq>=0.26",
  "asyncpg>=0.30",
  "boto3>=1.35",
  "fastapi>=0.115",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.20",
  "sqlalchemy[asyncio]>=2.0.36",
  "structlog>=24.4",
  "uvicorn[standard]>=0.32",
  # Analysis worker (02-music-analysis). CPU-only torch from the PyTorch CPU index (see [tool.uv.sources]).
  "basic-pitch[onnx]>=0.4",
  "demucs>=4.1",
  "librosa>=0.11",
  "numpy>=2",
  "soundfile>=0.12",
  "torch>=2.5",
  "torchaudio>=2.5",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "ruff>=0.7",
  "mypy>=1.13",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
  "aiosqlite>=0.20",
  "boto3-stubs[s3]>=1.35",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]
# basic-pitch 0.4.0 hard-requires TensorFlow < 2.15.1 (no Python 3.12 wheels): the worker runs its bundled ONNX
# model with onnxruntime instead, so the TensorFlow / CoreML / TFLite backends are removed. resampy < 0.4.3 imports
# the removed `pkg_resources`.
override-dependencies = [
  "tensorflow; sys_platform == 'never'",
  "tensorflow-macos; sys_platform == 'never'",
  "coremltools; sys_platform == 'never'",
  "tflite-runtime; sys_platform == 'never'",
  "resampy>=0.4.3",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["music_world"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: uses real models or long audio"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["music_world"]
