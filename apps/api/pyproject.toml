[project]
name = "music-world"
version = "0.1.0"
description = "Music World API, analysis worker and shared schemas"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "pydantic>=2.9,<3",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "ruff>=0.7",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["music_world"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: uses real models or long audio"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["music_world"]
