# Music World stack. Only Caddy publishes ports. Local: `make dev` (DOMAIN=localhost, APP_ENV=development).
name: music-world

# Docker log rotation for every service: at most 5 × 10 MB per container (the disk must last until 2027-01-29).
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  API_DOCS: ${API_DOCS:-false}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-music_world}:${POSTGRES_PASSWORD:-music_world}@postgres:5432/${POSTGRES_DB:-music_world}
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  STORAGE_DIR: /data/storage
  ANALYSIS_MIN_VELOCITY: ${ANALYSIS_MIN_VELOCITY:-0.25}
  DEMUCS_MODEL: ${DEMUCS_MODEL:-htdemucs}
  LYRICS_PROVIDER: ${LYRICS_PROVIDER:-muse}
  LLM_PROVIDER: ${LLM_PROVIDER:-muse}
  META_API_KEY: ${META_API_KEY:-}
  META_BASE_URL: ${META_BASE_URL:-https://api.meta.ai/v1}
  META_DIRECTOR_MODEL: ${META_DIRECTOR_MODEL:-muse-spark-1.3}
  META_SHAPE_MODEL: ${META_SHAPE_MODEL:-muse-wonder-1.0}
  META_SPEND_CAP_USD: ${META_SPEND_CAP_USD:-1}
  AWS_REGION: ${AWS_REGION:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
  BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-anthropic.claude-sonnet-5-5}
  BEDROCK_SHAPE_MODEL_ID: ${BEDROCK_SHAPE_MODEL_ID:-anthropic.claude-opus-5-5}
  DIRECTOR_TIMEOUT_SEC: ${DIRECTOR_TIMEOUT_SEC:-30}
  DIRECTOR_AUDIO_HINT: ${DIRECTOR_AUDIO_HINT:-false}
  DIRECTOR_RATE_LIMIT_PER_HOUR: ${DIRECTOR_RATE_LIMIT_PER_HOUR:-30}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://${DOMAIN:-localhost}}
  AUTH_EMAIL_SENDER: ${AUTH_EMAIL_SENDER:-console}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  AUTH_TOKEN_TTL_MIN: ${AUTH_TOKEN_TTL_MIN:-15}
  SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
  AUTH_RATE_LIMIT_PER_HOUR: ${AUTH_RATE_LIMIT_PER_HOUR:-10}
  TEMPLATE_PUBLISH_RATE_LIMIT_PER_HOUR: ${TEMPLATE_PUBLISH_RATE_LIMIT_PER_HOUR:-10}
  TEMPLATE_REPORT_HIDE_THRESHOLD: ${TEMPLATE_REPORT_HIDE_THRESHOLD:-3}
  UPLOAD_RATE_LIMIT_PER_HOUR: ${UPLOAD_RATE_LIMIT_PER_HOUR:-20}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      API_DOCS: ${API_DOCS:-false}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 10s
      retries: 5

  web:
    build: { context: .., dockerfile: infra/docker/web.Dockerfile }
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 5
      start_period: 10s

  api:
    build: { context: .., dockerfile: infra/docker/api.Dockerfile }
    image: music-world-api
    restart: unless-stopped
    logging: *logging
    environment: *api-env
    volumes: [storage:/data/storage]
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn music_world.main:create_app --factory --host 0.0.0.0 --port 8000 --workers 2 --forwarded-allow-ips '*'"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)"]
      interval: 10s
      retries: 5
      start_period: 15s

  worker:
    image: music-world-api
    restart: unless-stopped
    logging: *logging
    environment: *api-env
    command: ["arq", "music_world.worker.WorkerSettings"]
    stop_grace_period: 60s # let a running analysis stage finish; unfinished jobs resume from their last stage
    volumes: [storage:/data/storage]
    depends_on:
      api: { condition: service_healthy } # the api container runs the migrations
    healthcheck:
      test: ["CMD", "arq", "--check", "music_world.worker.WorkerSettings"]
      interval: 30s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-music_world}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-music_world}
      POSTGRES_DB: ${POSTGRES_DB:-music_world}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
  storage: # local object store (uploads, stems) while no S3 bucket is configured
  caddy_data:
  caddy_config:
